<!DOCTYPE html>
<html>
<head>
    <title>Bazel Rules for CodeChecker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />

    <!-- Themes (light + dark) -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.css" />
    <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.css" />

    <style>
        /* Hide the sidebar for narrow screen and show toggle button to bring it back.
           On wider screens the sidebar is always visible. */
        @media screen and (min-width: 1111px) {
            .sidebar-toggle {
                display: none !important;
            }
        }

        /* Code blocks inherit the prose line height (1.6) from the theme,
           which leaves gaps in the lines of ASCII trees */
        .markdown-section pre[data-lang="tree"] {
            line-height: 1.2 !important;
        }
    </style>
</head>

<body class="sidebar-chevron-left sidebar-group-box">
    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            name       : "rules_codechecker",
            repo       : "https://github.com/Ericsson/rules_codechecker",
            homepage   : "index.md",
            loadSidebar: "sidebar.md",
            auto2top   : true,
            maxLevel   : 2,
            subMaxLevel: 2,
        };
    </script>
    <!-- Required -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
    <!-- Recommended -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
    <!-- Syntax highlighting, docsify does not bundle the language grammars -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
