# Template for micromamba environments.
#
# init.sh generates an environment file from this template, substituting the
# @TOKEN@ placeholders. Use --bazel and --codechecker to select versions.
# The environment name is passed by init.sh, therefore it is not set here.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytest
  - pylint
  - pycodestyle
  - buildifier
  - clang=21
  - clang-tools=21
  - bazel=@BAZEL_VERSION@
  - gcc
  - gxx
  - git
  - wget
  - pip:
    - codechecker==@CODECHECKER_VERSION@
